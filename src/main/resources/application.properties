spring.application.name=faceTest
server.port=8080

# 数据库配置
#spring.datasource.url=jdbc:mysql://120.26.33.200:3306/face
#spring.datasource.username=face
spring.datasource.url=jdbc:mysql://localhost:3306/face
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MyBatis配置
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.luofeng.facetest.pojo
mybatis.configuration.map-underscore-to-camel-case=true

# 文件上传配置
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# 日志配置
logging.level.com.luofeng.facetest=debug